[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimum-wage-causal-inference"
version = "0.1.0"
description = "Five identification strategies for the effect of state minimum wages on unemployment"
readme = "README.md"
requires-python = ">=3.11,<3.14"

# Bounded on both sides. The published estimates in the README were produced
# on Python 3.13.7 with the versions recorded in `requirements.txt`; a future
# major release of linearmodels or statsmodels can change a default (degrees
# of freedom, clustering, optimiser) and silently move those numbers. Upper
# bounds mean that change arrives as a resolution failure to look at rather
# than as a different answer.
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
    "statsmodels>=0.14,<0.16",
    "linearmodels>=6.0,<8",
    "pyarrow>=15.0,<23",
    "openpyxl>=3.1,<4",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
    "plotly>=5.20,<7",
    "streamlit>=1.35,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<0.15",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pytz.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE"]
ignore = [
    "E501",  # long lines are prose in docstrings, not code
    "B008",  # streamlit/plotly call-in-default patterns
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
